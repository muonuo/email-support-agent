[project]
name = "email-support-agent"
version = "0.1.0"
description = "基于 LangGraph 的客户支持邮件 Agent —— Think In LangGraph 课程实战项目"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=0.3",
    "langchain-deepseek>=0.1",
    "langgraph>=0.3",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/email_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
